name: Update Content

on:
  push:
    branches:
      - master
    paths-ignore:
      - "src/**"
  workflow_dispatch:
    inputs:
      app_version:
        description: "APP_VERSION for this release (must match init.lua)"
        required: true
        default: "1"

jobs:
  package-and-deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # GitHub-hosted Windows runners scan every file I/O in real-time via
      # Windows Defender by default - with ~1500 small files being encrypted
      # one by one, this adds massive overhead (minutes instead of seconds
      # locally, where Defender exclusions are often already configured).
      # Excluding the workspace folder brings this back down to local speed.
      - name: Exclude workspace from Windows Defender
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"

      # otclient.exe liegt fest im Repo (ihr committet sie selbst nach
      # lokalem Neukompilieren) - kein Build-Schritt hier nötig
      - name: Verify otclient.exe exists
        run: |
          if (-not (Test-Path ".\otclient.exe")) {
            throw "otclient.exe nicht im Repo-Root gefunden - bitte committen"
          }

      # --- Packaging: encrypt, Manifest bauen, Dateien mirrorn, Website-exe bauen ---
      - name: Run release script
        env:
          ENCRYPT_SEED: ${{ secrets.CLIENT_ENCRYPT_SEED }}
          # bei manuellem Trigger: der eingegebene Wert. Bei normalem Push
          # (kein Input verfügbar): fortlaufende GitHub-Run-Nummer als Fallback
          APP_VERSION: ${{ inputs.app_version || github.run_number }}
        run: |
          .\build-release.ps1 `
            -SourceDir "$PWD" `
            -ExePath "$PWD\otclient.exe" `
            -WwwRoot "$PWD\release-staging" `
            -EncryptSeed "$env:ENCRYPT_SEED" `
            -AppVersion $env:APP_VERSION

      # --- Upload zum Server ---
      # 1500+ einzelne Dateien per scp -r ist extrem langsam/unzuverlässig
      # (Wildcard-Handling, SSH-Handshake-Overhead pro Datei). Stattdessen:
      # einmal zippen, EINE Datei übertragen, auf dem Server entpacken.
      - name: Zip release output for transfer
        run: |
          Compress-Archive -Path "release-staging\client-updater\*" `
            -DestinationPath "release-staging\upload.zip" -Force

      - name: Upload zip to server
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "deploy_key"
          $normalizedKey = ($env:SSH_KEY -replace "`r`n", "`n").Trim() + "`n"
          [System.IO.File]::WriteAllText($keyPath, $normalizedKey)

          # OpenSSH weigert sich, Keys mit zu offenen Berechtigungen zu nutzen -
          # ohne diesen Fix hängt scp/ssh lautlos an einer nie erscheinenden
          # Passwort-Abfrage, statt einen klaren Fehler zu zeigen.
          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "$($env:USERNAME):(R)" | Out-Null

          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$keyPath" `
            "release-staging\upload.zip" `
            "${env:SERVER_USER}@${env:SERVER_HOST}:/root/project-danubia-webservice/wwwroot/upload.zip"

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$keyPath" `
            "${env:SERVER_USER}@${env:SERVER_HOST}" `
            "cd /root/project-danubia-webservice/wwwroot && rm -rf client-updater && unzip -o -q upload.zip -d client-updater && rm upload.zip"

          Remove-Item $keyPath -Force -ErrorAction SilentlyContinue